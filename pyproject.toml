[project]
name = "hotd-decompress"
version = "0.1.0"
description = "Decompression CLI for House of the Dead (PC / Tantalus) PIFF assets."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Gareth Owen", email = "gareth.w.owen@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
hotd-decompress = "hotd_decompress.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "assets: tests that need game files under assets/",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
